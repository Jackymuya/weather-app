<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:;base64,iVBORw0KGgo=" />
</head>
<body>

  <div class="container">
    <div class="weather-container">
      <div class="temp">
        <p>20</p>
      </div>

      <div class="time_location">
        <p>Nairobi</p>
        <p>12:10 - Saturday 2025-6-14</p>
      </div>

      <div class="condition">
        <!--<img src="pic/sun.jpeg">-->
        <p>Sunny</p>
      </div>
    </div>

    <!-- ✅ Restructured Form -->
    <div class="form">
      <form>
        <input type="text" placeholder="Search for a location" class="search-area" id="cityInput"/>
        <button type="submit" id="Search">Search Button</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
